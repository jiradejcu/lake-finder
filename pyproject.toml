[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lake-finder"
version = "0.1.0"
description = "Find lakes and reservoirs next to mountains near Bangkok, with lakeside house sites that look across the water at the mountains."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "rasterio>=1.3", "requests>=2.28"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
lake-finder = "lake_finder.cli:main"

[tool.setuptools]
packages = ["lake_finder"]
